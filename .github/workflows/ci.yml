name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # WPF and the Win32 input code are Windows-only, so build and test on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NightLoop.sln

      - name: Build
        run: dotnet build NightLoop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NightLoop.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # Nobody can click through the app on a CI machine, so this loads every screen's XAML and the theme,
      # draws each one to a PNG and fails if any of them throws. The pictures are uploaded below.
      - name: UI smoke test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Get-ChildItem src/NightLoop.App/bin/Release -Recurse -Filter NightLoop.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--smoke', "$pwd\smoke" -Wait -PassThru
          "Exit code: $($p.ExitCode)"
          Get-ChildItem smoke -ErrorAction SilentlyContinue | Format-Table Name, Length
          Get-Content smoke\*.error.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "UI smoke test failed (exit $($p.ExitCode))" }

      - name: Upload screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: smoke/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
