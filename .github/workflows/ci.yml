name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # WPF and the Win32 input code are Windows-only, so build and test on Windows.
    runs-on: windows-latest
    permissions:
      contents: write # only for "Share screen pictures" below, which writes a hidden ref, never a branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NightLoop.sln

      - name: Build
        run: dotnet build NightLoop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NightLoop.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # Nobody can click through the app on a CI machine, so this loads every screen's XAML and the theme,
      # draws each one to a PNG and fails if any of them throws. The pictures are uploaded below.
      - name: UI smoke test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Get-ChildItem src/NightLoop.App/bin/Release -Recurse -Filter NightLoop.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--smoke', "$pwd\smoke" -Wait -PassThru
          "Exit code: $($p.ExitCode)"
          Get-ChildItem smoke -ErrorAction SilentlyContinue | Format-Table Name, Length
          Get-Content smoke\*.error.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "UI smoke test failed (exit $($p.ExitCode))" }

      # Touch screens: opens the Macros screen in a real window and drives it with Windows touch injection
      # (a swipe must scroll, taps must press a button and pick a block). Exit 3 means this machine can't inject
      # touch at all, which is reported as a warning rather than a pass.
      - name: Touch test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Get-ChildItem src/NightLoop.App/bin/Release -Recurse -Filter NightLoop.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--touch-test', "$pwd\smoke" -Wait -PassThru
          "Exit code: $($p.ExitCode)"
          Get-Content smoke\touch.txt -ErrorAction SilentlyContinue
          Get-Content smoke\touch.error.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -eq 3) { "::warning::Touch injection isn't available on this runner; touch was not tested." }
          elseif ($p.ExitCode -ne 0) { throw "Touch test failed (exit $($p.ExitCode))" }

      - name: Upload screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: smoke/

      # The cloud session that builds this app can't download Actions artifacts (its network only reaches
      # github.com), so the pictures also go to a hidden ref it can fetch with git:
      #   git fetch origin refs/ci-screens/pr-<number>
      # Hidden refs don't show up as branches. Same-repo pull requests only.
      - name: Share screen pictures
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
          REF: refs/ci-screens/pr-${{ github.event.number }}
        run: |
          if (-not (Test-Path smoke)) { "No pictures."; exit 0 }
          Set-Location smoke
          git init -q
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screens for ${{ github.event.pull_request.head.sha }}"
          git push -q --force "https://x-access-token:$env:TOKEN@github.com/${{ github.repository }}.git" "HEAD:$env:REF"
          "Pushed to $env:REF"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
